<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery - Система доставки еды</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 20px; }
        .product-card { transition: transform 0.3s; cursor: pointer; }
        .product-card:hover { transform: translateY(-5px); }
        .cart-item { border-bottom: 1px solid #eee; padding: 10px 0; }
        .status-badge { position: fixed; bottom: 20px; right: 20px; z-index: 1000; }
        .toast-notification { position: fixed; top: 20px; right: 20px; z-index: 1100; }
        .saga-status { font-size: 0.9em; }
        .navbar-brand { font-weight: bold; }
        .order-timeline { position: relative; padding: 20px; }
        .timeline-step { display: flex; align-items: center; margin-bottom: 15px; }
        .timeline-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px; background: #eee; }
        .timeline-icon.completed { background: #28a745; color: white; }
        .timeline-icon.active { background: #007bff; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .cart-count { position: absolute; top: -8px; right: -8px; background: #dc3545; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="toast-notification" id="toast"></div>
    <div class="container py-4">
        <!-- Header -->
        <div class="card bg-dark text-white mb-4">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col">
                        <h1 class="display-6"><i class="fas fa-pizza-slice"></i> Food Delivery System</h1>
                        <p class="mb-0">Интеграционный слой + Saga оркестрация</p>
                    </div>
                    <div class="col-auto">
                        <div class="position-relative">
                            <i class="fas fa-shopping-cart fa-2x" id="cartIcon" style="cursor: pointer;"></i>
                            <span class="cart-count" id="cartCount">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Левый столбец: Каталог -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-utensils"></i> Меню (Модуль А)</h5>
                    </div>
                    <div class="card-body">
                        <div class="row" id="productsContainer">
                            <div class="text-center">Загрузка...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Правый столбец: Корзина и Оформление -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-shopping-cart"></i> Корзина (Модуль Б)</h5>
                    </div>
                    <div class="card-body" style="max-height: 300px; overflow-y: auto;">
                        <div id="cartContainer">Корзина пуста</div>
                    </div>
                    <div class="card-footer">
                        <h5>Итого: <span id="cartTotal">0</span> ₽</h5>
                        <button class="btn btn-warning w-100" id="clearCartBtn">Очистить корзину</button>
                        <button class="btn btn-success w-100 mt-2" id="checkoutBtn">Оформить заказ</button>
                    </div>
                </div>

                <!-- Статус заказа -->
                <div class="card mt-3">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="fas fa-truck"></i> Статус заказа (Saga)</h5>
                    </div>
                    <div class="card-body" id="orderStatusContainer">
                        <div class="text-muted">Нет активных заказов</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно оформления заказа -->
    <div class="modal fade" id="checkoutModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Оформление заказа</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="orderForm">
                        <div class="mb-3">
                            <label>Ваше имя</label>
                            <input type="text" class="form-control" id="userName" value="Тестовый пользователь" required>
                        </div>
                        <div class="mb-3">
                            <label>Адрес доставки</label>
                            <input type="text" class="form-control" id="address" value="ул. Пушкина, 10" required>
                        </div>
                        <div class="mb-3">
                            <label>Способ оплаты</label>
                            <select class="form-select" id="paymentMethod">
                                <option value="CARD">💳 Карта</option>
                                <option value="CASH">💵 Наличные</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button class="btn btn-success" id="confirmOrderBtn">Подтвердить заказ</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Конфигурация сервисов
        const SERVICES = {
            catalog: 'http://localhost:5001',
            cart: 'http://localhost:5002',
            orders: 'http://localhost:3000',
            saga: 'http://localhost:5004'
        };
        
        let cartId = localStorage.getItem('cart_id') || 'cart_' + Math.random().toString(36).substr(2, 16);
        localStorage.setItem('cart_id', cartId);
        
        let currentOrderId = null;
        let statusInterval = null;
        
        // Вспомогательные функции
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const bgColor = type === 'success' ? '#28a745' : type === 'error' ? '#dc3545' : '#17a2b8';
            toast.innerHTML = `<div class="alert text-white" style="background: ${bgColor}; border-radius: 10px;">${message}</div>`;
            setTimeout(() => { toast.innerHTML = ''; }, 3000);
        }
        
        async function apiCall(url, options = {}) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error(`API Error: ${url}`, error);
                showToast(`Ошибка: ${error.message}`, 'error');
                throw error;
            }
        }
        
        // 8.1 + 8.2 — Загрузка каталога из модуля А
        async function loadCatalog() {
            try {
                const products = await apiCall(`${SERVICES.catalog}/products`);
                const container = document.getElementById('productsContainer');
                if (!products.length) {
                    container.innerHTML = '<div class="text-center">Нет товаров</div>';
                    return;
                }
                container.innerHTML = products.map(p => `
                    <div class="col-md-6 mb-3">
                        <div class="card product-card" onclick="addToCart(${p.id}, '${p.name}', ${p.price})">
                            <div class="card-body">
                                <h6>${p.name}</h6>
                                <p class="text-muted mb-1">${p.price} ₽</p>
                                <span class="badge ${p.inStock ? 'bg-success' : 'bg-danger'}">
                                    ${p.inStock ? 'В наличии' : 'Нет'}
                                </span>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('productsContainer').innerHTML = '<div class="text-danger">Ошибка загрузки меню</div>';
            }
        }
        
        // 8.2 — Добавление в корзину (модуль Б)
        window.addToCart = async function(productId, name, price) {
            try {
                const response = await fetch(`${SERVICES.cart}/cart/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Cart-ID': cartId },
                    body: JSON.stringify({ product_id: productId, product_name: name, price, quantity: 1 })
                });
                const result = await response.json();
                showToast(`✓ ${name} добавлен в корзину`);
                await loadCart();
            } catch (error) {
                showToast('Ошибка добавления', 'error');
            }
        };
        
        // Загрузка корзины
        async function loadCart() {
            try {
                const cart = await apiCall(`${SERVICES.cart}/cart`, { headers: { 'X-Cart-ID': cartId } });
                const container = document.getElementById('cartContainer');
                const totalSpan = document.getElementById('cartTotal');
                const countSpan = document.getElementById('cartCount');
                
                if (!cart.items || cart.items.length === 0) {
                    container.innerHTML = '<div class="text-muted text-center">Корзина пуста</div>';
                    totalSpan.innerText = '0';
                    countSpan.innerText = '0';
                    return;
                }
                
                container.innerHTML = cart.items.map(item => `
                    <div class="cart-item d-flex justify-content-between">
                        <div><strong>${item.name}</strong><br><small>${item.price} ₽ × ${item.quantity}</small></div>
                        <div>${item.price * item.quantity} ₽</div>
                    </div>
                `).join('');
                totalSpan.innerText = cart.total;
                countSpan.innerText = cart.items.reduce((s, i) => s + i.quantity, 0);
            } catch (error) {
                console.error(error);
            }
        }
        
        // Очистка корзины
        document.getElementById('clearCartBtn').addEventListener('click', async () => {
            cartId = 'cart_' + Math.random().toString(36).substr(2, 16);
            localStorage.setItem('cart_id', cartId);
            await loadCart();
            showToast('Корзина очищена');
        });
        
        // 8.2 + 8.3 — Оформление заказа через Saga оркестратор
        document.getElementById('checkoutBtn').addEventListener('click', () => {
            const modal = new bootstrap.Modal(document.getElementById('checkoutModal'));
            modal.show();
        });
        
        document.getElementById('confirmOrderBtn').addEventListener('click', async () => {
            const userName = document.getElementById('userName').value;
            const address = document.getElementById('address').value;
            const paymentMethod = document.getElementById('paymentMethod').value;
            
            if (!address) {
                showToast('Укажите адрес доставки', 'error');
                return;
            }
            
            const btn = document.getElementById('confirmOrderBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Обработка...';
            
            try {
                // 8.3 — Вызов Saga оркестратора (сквозной процесс)
                const result = await apiCall(`${SERVICES.saga}/saga/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userName, cart_id: cartId, address, payment_method: paymentMethod })
                });
                
                if (result.success) {
                    currentOrderId = result.order_id;
                    showToast(`✅ Заказ #${result.order_id} создан! Статус: ${result.status}`);
                    
                    // Обновляем статус в реальном времени
                    startStatusPolling(currentOrderId);
                    
                    // Очищаем корзину
                    cartId = 'cart_' + Math.random().toString(36).substr(2, 16);
                    localStorage.setItem('cart_id', cartId);
                    await loadCart();
                    
                    // Закрываем модалку
                    bootstrap.Modal.getInstance(document.getElementById('checkoutModal')).hide();
                } else {
                    showToast(`❌ Ошибка: ${result.error || 'Неизвестная ошибка'}`, 'error');
                }
            } catch (error) {
                showToast('Ошибка оформления заказа', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Подтвердить заказ';
            }
        });
        
        // 8.3 — Отображение статуса интеграции в реальном времени
        function startStatusPolling(orderId) {
            if (statusInterval) clearInterval(statusInterval);
            
            const container = document.getElementById('orderStatusContainer');
            
            const fetchStatus = async () => {
                try {
                    // Сначала проверяем статус в модуле В
                    const order = await apiCall(`${SERVICES.orders}/orders/${orderId}`);
                    updateStatusUI(order);
                    
                    if (order.status === 'DELIVERED' || order.status === 'CANCELLED') {
                        clearInterval(statusInterval);
                    }
                } catch (error) {
                    console.log('Ожидание статуса...');
                }
            };
            
            const updateStatusUI = (order) => {
                const statuses = [
                    { key: 'PENDING', label: 'Ожидание', icon: 'fa-clock', color: 'secondary' },
                    { key: 'STOCK_CHECK', label: 'Проверка', icon: 'fa-boxes', color: 'info' },
                    { key: 'PAYMENT_PENDING', label: 'Оплата', icon: 'fa-credit-card', color: 'warning' },
                    { key: 'COURIER_ASSIGNED', label: 'Курьер назначен', icon: 'fa-truck', color: 'primary' },
                    { key: 'DELIVERED', label: 'Доставлен', icon: 'fa-check-circle', color: 'success' }
                ];
                
                let currentStatus = order.status;
                let currentIndex = statuses.findIndex(s => s.key === currentStatus);
                if (currentIndex === -1) currentIndex = 0;
                
                container.innerHTML = `
                    <div class="order-timeline">
                        ${statuses.map((s, idx) => `
                            <div class="timeline-step">
                                <div class="timeline-icon ${idx <= currentIndex ? 'completed' : ''} ${idx === currentIndex && order.status !== 'DELIVERED' ? 'active' : ''}">
                                    <i class="fas ${s.icon}"></i>
                                </div>
                                <div>
                                    <strong>${s.label}</strong><br>
                                    <small class="text-muted">${idx <= currentIndex ? '✓' : '...'}</small>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <hr>
                    <div class="text-center">
                        <span class="badge bg-${order.status === 'DELIVERED' ? 'success' : 'primary'}">
                            Заказ #${order.id} — ${order.status}
                        </span>
                        ${order.courierId ? `<div class="mt-2"><i class="fas fa-motorcycle"></i> Курьер #${order.courierId}</div>` : ''}
                        ${order.eta ? `<div>⏱ Прибытие через ~${order.eta} мин</div>` : ''}
                    </div>
                `;
            };
            
            fetchStatus();
            statusInterval = setInterval(fetchStatus, 3000);
        }
        
        // Инициализация
        loadCatalog();
        loadCart();
    </script>
</body>
</html>
