name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors flake8
      
      - name: Lint with flake8
        run: flake8 *.py --max-line-length=120 --ignore=F403,F401,E501
      
      - name: Check syntax
        run: |
          python -m py_compile 1321312.py
          python -m py_compile module_b_cart.py
          python -m py_compile module_c_orders.py
      
      - name: Import test
        run: python -c "from flask import Flask; print('Flask OK')"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build catalog image
        run: docker build -f Dockerfile.catalog -t catalog-service:latest .
      
      - name: Build cart image
        run: docker build -f Dockerfile.cart -t cart-service:latest .
      
      - name: Build orders image
        run: docker build -f Dockerfile.orders -t orders-service:latest .
      
      - name: Docker build success
        run: echo "All Docker images built successfully"

  integration-test:
    runs-on: ubuntu-latest
    needs: docker-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Build and start services
        run: docker-compose up -d --build
      
      - name: Wait for services
        run: sleep 10
      
      - name: Test catalog
        run: curl -f http://localhost:5001/health
      
      - name: Test cart
        run: curl -f http://localhost:5002/health
      
      - name: Test orders
        run: curl -f http://localhost:3000/health
      
      - name: Stop services
        if: always()
        run: docker-compose down
