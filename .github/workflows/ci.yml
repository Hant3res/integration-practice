name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flask flask-cors flake8 black

      - name: Lint with flake8
        run: flake8 *.py --max-line-length=120 --ignore=F403,F401,E501

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build Docker images
        run: |
          docker build -f Dockerfile.catalog -t catalog-service .
          docker build -f Dockerfile.cart -t cart-service .
          docker build -f Dockerfile.orders -t orders-service .

      - name: Start services
        run: docker-compose up -d

      - name: Wait for services
        run: sleep 15

      - name: Integration tests
        run: |
          curl -f http://localhost:5001/health
          curl -f http://localhost:5002/health
          curl -f http://localhost:3000/health

      - name: Stop services
        if: always()
        run: docker-compose down
