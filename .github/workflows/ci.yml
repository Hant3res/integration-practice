name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 *.py --max-line-length=120 --ignore=F403,F401

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker build -f Dockerfile.catalog -t catalog-service .
          docker build -f Dockerfile.cart -t cart-service .
          docker build -f Dockerfile.orders -t orders-service .

      - name: Start services with docker-compose
        run: docker-compose up -d

      - name: Wait for services
        run: sleep 10

      - name: Test endpoints
        run: |
          curl -f http://localhost:5001/products || exit 1
          curl -f http://localhost:5002/cart || exit 1
          curl -f http://localhost:3000/orders || exit 1

      - name: Stop services
        if: always()
        run: docker-compose down
